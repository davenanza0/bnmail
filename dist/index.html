<!doctype html>
<html lang="pt-MZ" translate="no">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover: usa o ecrã inteiro no iPhone (notch / Dynamic Island) e expõe env(safe-area-inset-*). -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#fbf7f2" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1f1a16" media="(prefers-color-scheme: dark)" />
    <meta name="format-detection" content="telephone=no, email=no, address=no" />
    <meta name="robots" content="noindex, nofollow" />

    <!-- iOS / iPadOS / Safari: instalação no ecrã principal (modo aplicação) -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="BN Lab" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="application-name" content="BN Lab" />
    <meta name="msapplication-TileColor" content="#f2742b" />
    <meta name="msapplication-tap-highlight" content="no" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />

    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Fontes não bloqueiam a primeira pintura (display=swap + carregamento assíncrono). -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      />
    </noscript>

    <title>BN Lab — Painel de gestão de email</title>
    <meta
      name="description"
      content="Painel BN Lab para gerir contas de correio electrónico: palavra-passe, autorespostas, filtros, spam e configurações IMAP, POP3 e SMTP."
    />

    <!-- Aplica o tema antes da primeira pintura: evita o "flash" branco no modo escuro. -->
    <script>
      (function () {
        try {
          var s = null;
          try { s = localStorage.getItem("bnlab.theme"); } catch (e) {}
          var dark =
            s === "dark" ||
            ((s === "system" || !s) && window.matchMedia("(prefers-color-scheme: dark)").matches);
          var r = document.documentElement;
          if (dark) r.classList.add("dark");
          r.style.colorScheme = dark ? "dark" : "light";
          r.style.backgroundColor = dark ? "#1f1a16" : "#fbf7f2";
        } catch (e) {}
      })();
    </script>
    <script>
      // Rede de segurança contra ecrã vazio: se um ficheiro JS falhar (deploy novo
      // com ficheiros antigos em cache, rede cortada), recarrega UMA vez; se
      // continuar a falhar, mostra mensagem em vez de ecrã vazio.
      (function () {
        function recover() {
          var k = "bnlab.reloaded", done = false;
          try { done = sessionStorage.getItem(k) === "1"; if (!done) sessionStorage.setItem(k, "1"); } catch (e) {}
          if (!done) { location.reload(); return; }
          var r = document.getElementById("root");
          if (r && !r.firstElementChild) {
            r.innerHTML = '<div style="font-family:system-ui,sans-serif;text-align:center;padding:4rem 1.5rem">' +
              '<h1 style="font-size:1.2rem;margin:0 0 .5rem">Não foi possível carregar a aplicação</h1>' +
              '<p style="opacity:.7;margin:0 0 1.2rem">Verifique a ligação à internet e tente novamente.</p>' +
              '<button onclick="try{sessionStorage.removeItem(\'bnlab.reloaded\')}catch(e){};location.reload()" ' +
              'style="background:#f2742b;color:#fff;border:0;border-radius:12px;padding:.7rem 1.4rem;font-size:1rem;font-weight:600">Tentar novamente</button></div>';
          }
        }
        window.addEventListener("vite:preloadError", function (e) { e.preventDefault(); recover(); });
        window.addEventListener("error", function (e) {
          var t = e.target;
          if (t && t.tagName === "SCRIPT" && t.src) recover();
        }, true);
        window.addEventListener("load", function () {
          setTimeout(function () {
            var r = document.getElementById("root");
            if (r && !r.firstElementChild) recover(); else try { sessionStorage.removeItem("bnlab.reloaded"); } catch (e) {}
          }, 6000);
        });
      })();
    </script>
    <style>
      /* Ecrã de arranque leve, visível até o React montar. */
      #root:empty::before {
        content: "";
        position: fixed;
        inset: 0;
        margin: auto;
        width: 28px;
        height: 28px;
        border-radius: 50%;
        border: 3px solid rgba(242, 116, 43, 0.25);
        border-top-color: #f2742b;
        animation: boot-spin 0.8s linear infinite;
      }
      @keyframes boot-spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) { #root:empty::before { animation-duration: 2s; } }
    </style>
    <script type="module" crossorigin src="/assets/index-CN7Jx8xQ.js"></script>
    <link rel="modulepreload" crossorigin href="/assets/react-DQvHu8dN.js">
    <link rel="modulepreload" crossorigin href="/assets/tanstack-BMA4Yq9F.js">
    <link rel="stylesheet" crossorigin href="/assets/index-DbJFvatc.css">
  </head>
  <body>
    <noscript>Este painel requer JavaScript para funcionar. Active o JavaScript no seu navegador.</noscript>
    <div id="root"></div>
  </body>
</html>
